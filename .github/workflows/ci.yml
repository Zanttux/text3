name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Disk-full drill (crates/text3-app/tests/disk_full.rs) on a real
      # tiny filesystem; the test fills it itself. Built-in tools only.
      - name: disk-full drill (4 MiB tmpfs)
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /mnt/text3-full
          sudo mount -t tmpfs -o size=4m tmpfs /mnt/text3-full
          sudo chown "$(id -u):$(id -g)" /mnt/text3-full
          TEXT3_FULL_DIR=/mnt/text3-full cargo test -p text3-app --test disk_full --locked -- --nocapture
          sudo umount /mnt/text3-full
      - name: disk-full drill (2 MiB HFS+ image)
        if: runner.os == 'macOS'
        run: |
          img="$RUNNER_TEMP/text3-full.dmg"
          mnt="$RUNNER_TEMP/text3-full"
          for i in 1 2 3; do
            hdiutil create -size 2m -fs HFS+ -volname Text3Full -layout NONE -ov "$img" && break
            sleep 5
          done
          hdiutil attach -nobrowse -mountpoint "$mnt" "$img"
          TEXT3_FULL_DIR="$mnt" cargo test -p text3-app --test disk_full --locked -- --nocapture
          hdiutil detach "$mnt"
      - name: disk-full drill (8 MiB NTFS VHD)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP 'text3-full.vhdx'
          $script = Join-Path $env:RUNNER_TEMP 'text3-full.diskpart'
          @(
            "create vdisk file=`"$vhd`" maximum=8 type=fixed",
            "select vdisk file=`"$vhd`"",
            'attach vdisk',
            'create partition primary',
            'format fs=ntfs quick label=Text3Full',
            'assign letter=S'
          ) | Set-Content -Encoding ascii $script
          diskpart /s $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TEXT3_FULL_DIR = 'S:\'
          cargo test -p text3-app --test disk_full --locked -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Large-file workloads (#206, scripts/bench/workloads.py): the release
  # build opens, filters, searches, types into and scrolls generated files
  # through its own UI code and must stay within bench/budgets.json. The
  # CI set is smaller than the full one (200 MB log instead of 1 GB, 50 MB
  # find, 100 typed characters) and the budgets are generous: hosted
  # runners are slow, shared and have no GPU (Linux: Xvfb and Mesa's
  # software Vulkan; Windows: Direct3D's software adapter at ~200 ms per
  # frame, with its own limits under workloads_by_os).
  workloads:
    name: workloads (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo build --release --locked -p text3-app
      - name: display server and software renderer
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth mesa-vulkan-drivers libegl1 libgl1-mesa-dri libxkbcommon-x11-0
      - name: workloads (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python3 scripts/bench/workloads.py --quick --runs 3 --no-build --check bench/budgets.json --json target/workloads.json
      - name: workloads
        if: runner.os != 'Linux'
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/bench/workloads.py --quick --runs 3 --no-build --check bench/budgets.json --json target/workloads.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: workloads-${{ matrix.os }}
          path: target/workloads.json
          if-no-files-found: ignore

  # Dependency licenses, RustSec advisories and sources (deny.toml).
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No keys, certificates or tokens in the repository
      # (docs/SECURITY_SECRETS.md).
      - name: secret check
        run: python3 scripts/check-secrets.py
      - run: rustup toolchain install
      # Built from crates.io with its own lockfile: the repository allows
      # only GitHub-owned actions.
      - run: cargo install cargo-deny --version 0.22.1 --locked
      - run: cargo deny --locked check
      # Every linked crate must have license text for the notices file.
      - run: python3 scripts/third-party-notices.py target/THIRD_PARTY_NOTICES.md
